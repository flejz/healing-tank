<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="840" viewBox="0 0 1120 840" font-family="'JetBrains Mono','Courier New',monospace">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="6.5" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 Z" fill="#7dd3a0"/>
    </marker>
    <style>
      .lbl   { fill:#cfeede; font-size:13px; }
      .pin   { fill:#9fb8aa; font-size:12px; paint-order:stroke; stroke:#070b08; stroke-width:3px; stroke-linejoin:round; }
      .note  { paint-order:stroke; stroke:#070b08; stroke-width:3px; stroke-linejoin:round; }
      .comp  { fill:#00ff41; font-size:16px; font-weight:bold; letter-spacing:1px; }
      .sub   { fill:#5b7a68; font-size:11px; }
      .note  { fill:#6f8d7c; font-size:11px; }
      .title { fill:#00ffff; font-size:22px; font-weight:bold; letter-spacing:3px; }
      .dot   { fill:#cfeede; }
      .box   { fill:#0e1611; stroke:#00ff41; stroke-width:1.5; }
      .pinbox{ fill:#16241c; stroke:#2f4d3b; stroke-width:1; }
      .w5v   { stroke:#ff4040; stroke-width:2.5; fill:none; }
      .w3v3  { stroke:#ff9c2f; stroke-width:2.5; fill:none; }
      .wgnd  { stroke:#9aa7a0; stroke-width:2.5; fill:none; }
      .wi2c  { stroke:#27d3e0; stroke-width:2.5; fill:none; }
      .wdata { stroke:#39e639; stroke-width:2.5; fill:none; }
      .res   { stroke:#39e639; stroke-width:2.5; fill:none; }
      .cap   { stroke:#ff4040; stroke-width:2.5; fill:none; }
    </style>
  </defs>

  <rect width="1120" height="840" fill="#070b08"/>
  <text x="40" y="46" class="title">BIO-TANK MK.VII &#8212; WIRING</text>
  <text x="40" y="68" class="sub">ESP32 &#183; SSD1306 OLED (I2C) &#183; WS2812B 22-LED strip (RMT)</text>

  <!-- legend -->
  <g transform="translate(820,30)">
    <rect x="0" y="0" width="262" height="86" class="pinbox"/>
    <text x="14" y="20" class="lbl">LEGEND</text>
    <line x1="14" y1="38" x2="44" y2="38" class="w5v"/>    <text x="52" y="42" class="pin">5V</text>
    <line x1="14" y1="58" x2="44" y2="58" class="w3v3"/>   <text x="52" y="62" class="pin">3V3</text>
    <line x1="14" y1="78" x2="44" y2="78" class="wgnd"/>   <text x="52" y="82" class="pin">GND</text>
    <line x1="120" y1="38" x2="150" y2="38" class="wi2c"/> <text x="158" y="42" class="pin">I2C (SDA/SCL)</text>
    <line x1="120" y1="58" x2="150" y2="58" class="wdata"/><text x="158" y="62" class="pin">LED data</text>
  </g>

  <!-- ════ WIRES (drawn first, so labels render on top) ════ -->
  <!-- power in -->
  <polyline points="196,400 276,400" class="w5v" marker-end="url(#arrow)"/>
  <polyline points="196,470 276,470" class="wgnd" marker-end="url(#arrow)"/>

  <!-- 3V3 -> OLED VCC -->
  <polyline points="564,340 690,340 690,239 800,239" class="w3v3"/>
  <!-- GPIO21 -> OLED SDA -->
  <polyline points="564,380 668,380 668,299 800,299" class="wi2c"/>
  <!-- GPIO22 -> OLED SCL -->
  <polyline points="564,420 646,420 646,329 800,329" class="wi2c"/>

  <!-- GND bus -> OLED GND + strip GND -->
  <polyline points="564,460 740,460 740,269 800,269" class="wgnd"/>
  <polyline points="740,460 740,571 800,571" class="wgnd"/>
  <circle cx="740" cy="460" r="3.5" class="dot"/>

  <!-- 5V -> strip 5V -->
  <polyline points="564,500 700,500 700,507 800,507" class="w5v"/>

  <!-- GPIO2 -> resistor -> strip DIN -->
  <polyline points="564,540 600,540 600,539 612,539" class="wdata"/>
  <polyline points="612,539 618,529 630,549 642,529 654,549 666,529 672,539" class="res"/>
  <polyline points="672,539 800,539" class="wdata"/>

  <!-- decoupling cap across strip rails -->
  <polyline points="700,507 700,524" class="cap"/>
  <line x1="688" y1="524" x2="712" y2="524" class="cap"/>
  <line x1="688" y1="532" x2="712" y2="532" class="cap"/>
  <polyline points="700,532 700,548 740,548" class="cap"/>
  <circle cx="700" cy="507" r="3.5" class="dot"/>
  <circle cx="740" cy="548" r="3.5" class="dot"/>

  <!-- ════ COMPONENTS + LABELS (on top of wires) ════ -->
  <!-- ESP32 -->
  <rect x="300" y="290" width="240" height="290" rx="6" class="box"/>
  <text x="420" y="322" text-anchor="middle" class="comp">ESP32</text>
  <text x="420" y="340" text-anchor="middle" class="sub">DevKit (WROOM-32)</text>
  <rect x="276" y="392" width="24" height="16" class="pinbox"/><text x="312" y="404" class="pin">5V / VIN</text>
  <rect x="276" y="462" width="24" height="16" class="pinbox"/><text x="312" y="474" class="pin">GND</text>
  <rect x="540" y="332" width="24" height="16" class="pinbox"/><text x="528" y="344" text-anchor="end" class="pin">3V3</text>
  <rect x="540" y="372" width="24" height="16" class="pinbox"/><text x="528" y="384" text-anchor="end" class="pin">GPIO21 (SDA)</text>
  <rect x="540" y="412" width="24" height="16" class="pinbox"/><text x="528" y="424" text-anchor="end" class="pin">GPIO22 (SCL)</text>
  <rect x="540" y="452" width="24" height="16" class="pinbox"/><text x="528" y="464" text-anchor="end" class="pin">GND</text>
  <rect x="540" y="492" width="24" height="16" class="pinbox"/><text x="528" y="504" text-anchor="end" class="pin">5V</text>
  <rect x="540" y="532" width="24" height="16" class="pinbox"/><text x="528" y="544" text-anchor="end" class="pin">GPIO2</text>

  <!-- OLED -->
  <rect x="800" y="160" width="240" height="170" rx="6" class="box"/>
  <text x="920" y="190" text-anchor="middle" class="comp">SSD1306</text>
  <text x="920" y="208" text-anchor="middle" class="sub">OLED 128&#215;64 &#183; 400 kHz</text>
  <rect x="800" y="232" width="24" height="14" class="pinbox"/><text x="830" y="243" class="pin">VCC</text>
  <rect x="800" y="262" width="24" height="14" class="pinbox"/><text x="830" y="273" class="pin">GND</text>
  <rect x="800" y="292" width="24" height="14" class="pinbox"/><text x="830" y="303" class="pin">SDA</text>
  <rect x="800" y="322" width="24" height="14" class="pinbox"/><text x="830" y="333" class="pin">SCL</text>

  <!-- WS2812B -->
  <rect x="800" y="470" width="260" height="120" rx="6" class="box"/>
  <text x="930" y="500" text-anchor="middle" class="comp">WS2812B</text>
  <text x="930" y="518" text-anchor="middle" class="sub">22 LEDs &#183; GRB</text>
  <rect x="800" y="500" width="24" height="14" class="pinbox"/><text x="830" y="511" class="pin">5V</text>
  <rect x="800" y="532" width="24" height="14" class="pinbox"/><text x="830" y="543" class="pin">DIN</text>
  <rect x="800" y="564" width="24" height="14" class="pinbox"/><text x="830" y="575" class="pin">GND</text>

  <!-- wire annotations (on top) -->
  <text x="192" y="395" text-anchor="end" class="pin">5V USB</text>
  <text x="192" y="465" text-anchor="end" class="pin">GND</text>
  <text x="642" y="568" text-anchor="middle" class="note">330&#8211;470&#937;</text>
  <text x="720" y="532" class="note">1000&#181;F</text>

  <!-- notes -->
  <text x="40" y="636" class="note">&#183; Most OLED modules include I2C pull-ups; if not, add 4.7k&#937; from SDA/SCL to 3V3.</text>
  <text x="40" y="656" class="note">&#183; Series resistor on DIN + bulk cap across the strip rails protect the first LED at power-up.</text>
  <text x="40" y="676" class="note">&#183; Strip 5V drawn from the USB 5V rail; ESP32 and strip share a common ground.</text>

  <!-- future pump -->
  <rect x="40" y="712" width="1040" height="92" rx="6" fill="none" stroke="#3a5446" stroke-width="1.4" stroke-dasharray="6 5"/>
  <text x="58" y="738" class="sub">FUTURE &#8212; WATER PUMP (parts TBD)</text>
  <text x="58" y="762" class="note">5V &#8594; pump &#8594; MOSFET drain &#183; gate &#8592; 330&#937; &#8592; free GPIO &#183; source &#8594; GND</text>
  <text x="58" y="782" class="note">1N4007 flyback diode across pump terminals.</text>
</svg>
