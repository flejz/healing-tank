<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BIO-TANK MK.VII</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #000;
    color: #00ff41;
    font-family: 'Courier New', monospace;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
  }
  .panel { border: 1px solid #00ff41; padding: 20px; width: 100%; max-width: 500px; }
  h1 {
    text-align: center;
    letter-spacing: 3px;
    font-size: 0.88rem;
    border-bottom: 1px solid #00ff41;
    padding-bottom: 12px;
    margin-bottom: 20px;
    color: #00ffff;
  }
  .row { margin-bottom: 18px; }
  label { display: block; font-size: 0.72rem; color: #555; letter-spacing: 2px; margin-bottom: 7px; }
  .btn-group { display: flex; gap: 6px; flex-wrap: wrap; }
  button {
    background: #000;
    color: #00ff41;
    border: 1px solid #00ff41;
    padding: 6px 12px;
    font-family: monospace;
    font-size: 0.8rem;
    cursor: pointer;
    letter-spacing: 1px;
  }
  button:hover { background: #003300; }
  button.active { background: #00ff41; color: #000; }
  button.mode-rainbow.active { background: linear-gradient(90deg,#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00); color: #000; border-color: transparent; }
  button.mode-off.active { background: #330000; color: #ff0033; border-color: #ff0033; }

  /* brightness slider */
  input[type=range] {
    -webkit-appearance: none;
    width: 100%;
    height: 3px;
    background: #1a1a1a;
    outline: none;
    margin: 8px 0 4px;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 13px;
    height: 13px;
    background: #00ff41;
    cursor: pointer;
    border-radius: 0;
  }

  /* color picker row */
  .color-picker-row { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
  #colorpicker {
    width: 48px;
    height: 36px;
    border: 1px solid #00ff41;
    background: none;
    cursor: pointer;
    padding: 2px;
  }
  .color-hex { font-size: 0.85rem; color: #00ffff; letter-spacing: 2px; }

  /* presets */
  .presets { display: flex; gap: 6px; flex-wrap: wrap; }
  .preset-btn {
    width: 32px;
    height: 24px;
    border: 1px solid #333;
    cursor: pointer;
    padding: 0;
    font-size: 0;
  }
  .preset-btn:hover { border-color: #fff; }
  .preset-label { font-size: 0.65rem; color: #444; margin-bottom: 5px; letter-spacing: 1px; }

  /* message */
  .msg-row { display: flex; gap: 6px; }
  #msg-input {
    flex: 1;
    background: #000;
    color: #00ff41;
    border: 1px solid #333;
    border-bottom-color: #00ff41;
    padding: 5px 8px;
    font-family: monospace;
    font-size: 0.82rem;
    outline: none;
    text-transform: uppercase;
  }
  #msg-input:focus { border-color: #00ff41; }
  #msg-input::placeholder { color: #1a1a1a; }

  .statusbar {
    font-size: 0.68rem;
    color: #333;
    letter-spacing: 1px;
    margin-top: 18px;
    text-align: center;
    min-height: 1.2em;
  }
  .ok { color: #00ff41; }
  .err { color: #ff0033; }
  .info { color: #00ffff; }
</style>
</head>
<body>
<div class="panel">
  <h1>&#9556; BIO-TANK MK.VII CONTROL &#9559;</h1>

  <div class="row">
    <label>LED MODE</label>
    <div class="btn-group">
      <button id="btn-breathing" class="mode-breathing" onclick="setMode('breathing')">BREATHING</button>
      <button id="btn-glitch"    class="mode-glitch"    onclick="setMode('glitch')">GLITCH</button>
      <button id="btn-rainbow"   class="mode-rainbow"   onclick="setMode('rainbow')">RAINBOW</button>
      <button id="btn-off"       class="mode-off"       onclick="setMode('off')">OFF</button>
    </div>
  </div>

  <div class="row">
    <label>BRIGHTNESS &mdash; <span id="brt-val">255</span></label>
    <input type="range" id="brightness" min="0" max="255" value="255"
           oninput="document.getElementById('brt-val').textContent=this.value"
           onchange="post('/api/brightness',{value:+this.value})">
  </div>

  <div class="row">
    <label>COLOR</label>
    <div class="color-picker-row">
      <input type="color" id="colorpicker" value="#ff0000" onchange="applyPicker(this.value)">
      <span class="color-hex" id="color-hex">#FF0000</span>
    </div>
    <div class="preset-label">PRESETS</div>
    <div class="presets">
      <button class="preset-btn" style="background:#ff0000" title="RED"    onclick="applyPreset('#ff0000')"></button>
      <button class="preset-btn" style="background:#00ffff" title="CYAN"   onclick="applyPreset('#00ffff')"></button>
      <button class="preset-btn" style="background:#00ff41" title="GREEN"  onclick="applyPreset('#00ff41')"></button>
      <button class="preset-btn" style="background:#7b00ff" title="PURPLE" onclick="applyPreset('#7b00ff')"></button>
      <button class="preset-btn" style="background:#ff6b00" title="ORANGE" onclick="applyPreset('#ff6b00')"></button>
      <button class="preset-btn" style="background:#ff007f" title="PINK"   onclick="applyPreset('#ff007f')"></button>
      <button class="preset-btn" style="background:#ffffff" title="WHITE"  onclick="applyPreset('#ffffff')"></button>
    </div>
  </div>

  <div class="row">
    <label>STATUS MSG &mdash; blank = cycle</label>
    <div class="msg-row">
      <input type="text" id="msg-input" placeholder="NEURAL SYNC OK" maxlength="16">
      <button onclick="setMessage()">SET</button>
      <button onclick="clearMessage()">CLR</button>
    </div>
  </div>

  <div class="statusbar" id="status">INITIALIZING...</div>
</div>

<script>
function post(path, body) {
  return fetch(path, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  }).then(r => {
    setStatus(r.ok ? null : 'ERR ' + r.status);
    return r.ok;
  }).catch(() => { setStatus('UNREACHABLE'); return false; });
}

function setStatus(msg) {
  const el = document.getElementById('status');
  el.innerHTML = msg
    ? '<span class="err">' + msg + '</span>'
    : '<span class="ok">OK</span>';
}

function setMode(m) {
  ['breathing','glitch','rainbow','off'].forEach(id => {
    document.getElementById('btn-'+id).classList.toggle('active', id === m);
  });
  post('/api/mode', { mode: m });
}

function hexToRgb(hex) {
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  return {r, g, b};
}

function applyPicker(hex) {
  document.getElementById('color-hex').textContent = hex.toUpperCase();
  const {r,g,b} = hexToRgb(hex);
  post('/api/color', {r, g, b});
}

function applyPreset(hex) {
  document.getElementById('colorpicker').value = hex;
  applyPicker(hex);
}

function setMessage() {
  post('/api/message', { text: document.getElementById('msg-input').value });
}

function clearMessage() {
  document.getElementById('msg-input').value = '';
  post('/api/message', { text: '' });
}

// Load current state on open
fetch('/api/state').then(r => r.json()).then(s => {
  setMode(s.mode);

  document.getElementById('brightness').value = s.brightness;
  document.getElementById('brt-val').textContent = s.brightness;

  if (s.color) {
    const hex = '#' +
      s.color.r.toString(16).padStart(2,'0') +
      s.color.g.toString(16).padStart(2,'0') +
      s.color.b.toString(16).padStart(2,'0');
    document.getElementById('colorpicker').value = hex;
    document.getElementById('color-hex').textContent = hex.toUpperCase();
  }

  if (s.message) document.getElementById('msg-input').value = s.message;

  const el = document.getElementById('status');
  el.innerHTML = 'CONNECTED &bull; <span class="info">' + s.wifi + '</span>';
}).catch(() => {
  document.getElementById('status').innerHTML = '<span class="err">STATE FETCH FAILED</span>';
});
</script>
</body>
</html>
