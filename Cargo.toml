[package]
name = "healing-tank-screen"
version = "0.1.0"
edition = "2021"

[dependencies]
esp-idf-svc = { version = "0.52", features = ["alloc"] }
esp-idf-hal = "0.46"
anyhow = "1"
libm = "0.2"
log = "0.4"
ssd1306 = "0.8"
embedded-graphics = "0.8"

[build-dependencies]
embuild = "0.33"

[profile.release]
opt-level = "s"

[profile.dev]
debug = true
opt-level = "z"
